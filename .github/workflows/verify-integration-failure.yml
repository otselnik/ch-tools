name: Verify replica scenarios under concurrent load
on:
  push:
    branches: [bd_dev/parallel-failure-check-521]
permissions:
  contents: read
jobs:
  replicas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clickhouse: ['26.3.12.3', latest]
    env:
      CLICKHOUSE_VERSION: ${{ matrix.clickhouse }}
      INTEGRATION_JOBS: '3'
      BEHAVE_ARGS: -n "Restore table replica after migration to Replicated|Offline-detach object-storage parts while the second replica is unavailable|Clean with temporarily unavailable replica succeeds after replica returns"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b88b94ab443acb34a2e4aa7eb1d044bdfbcc9272
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/test-integration
        with:
          artifact-suffix: replicas-${{ matrix.clickhouse }}
      - shell: python
        run: |
          import json
          from pathlib import Path
          path, = Path('tests/staging/parallel').glob('*/results/summary.json')
          report = json.loads(path.read_text())
          assert report['selected_features'] == report['selected_scenarios'] == 3
          assert all(f['scenarios']['passed'] == 1 for f in report['features'].values())
